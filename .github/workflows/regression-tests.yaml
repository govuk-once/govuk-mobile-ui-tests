name: Regression Tests

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  regression-test:
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, android]
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      APP_ID: uk.gov.govuk.dev
      GOVUK_EMAIL: ${{ secrets.GOVUK_EMAIL }}
      GOVUK_PASSWORD: ${{ secrets.GOVUK_PASSWORD }}
      GOVUK_TOTP_SECRET: ${{ secrets.GOVUK_TOTP_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Start ${{ matrix.platform }} device
        run: |
          if [ "${{ matrix.platform }}" = "ios" ]; then
            IOS_RUNTIME=$(xcrun simctl list runtimes -j | python3 -c '
          import json, sys
          runtimes = [
              runtime["version"]
              for runtime in json.load(sys.stdin)["runtimes"]
              if runtime["isAvailable"] and runtime["name"].startswith("iOS ")
          ]
          if not runtimes:
              raise SystemExit("No available iOS simulator runtime found")
          version = max(runtimes, key=lambda value: tuple(int(part) for part in value.split(".")))
          print("iOS-" + version.replace(".", "-"))
          ')
            echo "Starting iOS simulator with runtime $IOS_RUNTIME"
            maestro start-device --platform ios --device-os "$IOS_RUNTIME"
          else
            maestro start-device --platform android
          fi

      - name: Check sign-in secrets
        run: |
          for name in GOVUK_EMAIL GOVUK_PASSWORD GOVUK_TOTP_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::Required Actions secret $name is missing or empty"
              exit 1
            fi
          done

      - name: Run regression tests
        run: |
          mkdir -p test-output
          maestro test --include-tags=end-to-end flows/ \
            --format junit \
            --output test-output/report.xml \
            --test-output-dir test-output \
            --flatten-debug-output \
            -e GOVUK_EMAIL="$GOVUK_EMAIL" \
            -e GOVUK_PASSWORD="$GOVUK_PASSWORD" \
            -e GOVUK_TOTP_SECRET="$GOVUK_TOTP_SECRET"

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-artifacts-${{ matrix.platform }}
          path: test-output/
