appId: uk.gov.govuk.dev
---

- runFlow:
    when:
      platform: Android
    commands:
    - assertVisible:
        id: "toggle Share app usage statistics"
        checked: true

- runFlow:
    when:
      platform: iOS
    commands:
    - scrollUntilVisible:
        element:
          text: "Share app usage statistics"
        centerElement: true
    - assertVisible:
        text: "Share app usage statistics"
