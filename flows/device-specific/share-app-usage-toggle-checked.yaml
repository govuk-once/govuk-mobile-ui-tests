appId: uk.gov.govuk.dev
---

- runFlow:
    when:
      platform: Android
    commands:
    - assertVisible: "Share app usage statistics, On"

- runFlow:
    when:
      platform: iOS
    commands:
    - scrollUntilVisible:
        element:
          text: "Share app usage statistics"
        centerElement: true
    - assertVisible:
        text: "Share app usage statistics"
