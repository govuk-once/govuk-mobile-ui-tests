appId: uk.gov.govuk.dev

---
# iOS exposes the button as "Edit your topics" to accessibility tools
- assertVisible: "Edit|Edit your topics"
- tapOn: "Edit|Edit your topics"

- runFlow:
    when:
      platform: Android
    file: Android/edit-initial-topics-android.yaml

- runFlow:
    when:
      platform: iOS
    file: iOS/edit-initial-topics-ios.yaml

- runFlow: back-or-done.yaml
