appId: uk.gov.govuk.dev
---

# The app only asks new users. For an account that has signed in to the app
# before, it restores the previous choice and skips this screen.
- extendedWaitUntil:
    visible: "Share statistics|Select relevant topics|Allow notifications\\?|Your topics"
    timeout: 20000

- runFlow:
    when:
      visible: "Share statistics"
    commands:
    - runFlow:
        when:
          platform: Android
        commands:
        - tapOn: "Share statistics"
    # iOS on slow devices (e.g. CI): the first tap can land before the screen
    # is ready, and the next screen can take a while to appear, so retry the
    # tap if nothing changed and wait for the screen to move on.
    - runFlow:
        when:
          platform: iOS
        commands:
        - tapOn:
            text: "Share statistics"
            waitToSettleTimeoutMs: 5000
            retryTapIfNoChange: true
        - extendedWaitUntil:
            notVisible: "Share statistics"
            timeout: 60000