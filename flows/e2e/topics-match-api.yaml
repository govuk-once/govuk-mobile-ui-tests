appId: uk.gov.govuk.dev

tags:
- e2e
---

# API -> UI check: every topic the API returns must appear in the app.
# 1. Ask the API for the topics list (the same endpoint the app uses).
# 2. Sign in, skip topic selection, and open the "All topics" tab.
# 3. Check each topic from step 1 is shown, scrolling to find it.
# Run via: ./run-e2e.sh  (API contract tests first, then this flow)

- runScript:
    file: ../../scripts/fetch-topics.js

- launchApp:
    clearState: true

- runFlow: ../auth/sign-in.yaml

- runFlow: ../onboarding/accept-terms.yaml

- runFlow: ../onboarding/accept-statistics-sharing.yaml

- runFlow: ../topics/skip-initial-topics-selection.yaml

- runFlow: ../onboarding/skip-notifications.yaml

# Skipped topics are listed under the "All topics" tab, not "Your topics"
- tapOn:
    text: "All topics"
    waitToSettleTimeoutMs: 5000

- repeat:
    while:
      true: ${output.topicIndex < output.topicCount}
    commands:
    - runScript:
        file: ../../scripts/next-topic.js
    # The API order may differ from the screen order, so look below first,
    # then above if it was not found.
    - scrollUntilVisible:
        element:
          text: ${output.currentTopicPattern}
        direction: DOWN
        timeout: 15000
        optional: true
    - runFlow:
        when:
          notVisible: ${output.currentTopicPattern}
        commands:
        - scrollUntilVisible:
            element:
              text: ${output.currentTopicPattern}
            direction: UP
            timeout: 15000
            optional: true
    - assertVisible: ${output.currentTopicPattern}
