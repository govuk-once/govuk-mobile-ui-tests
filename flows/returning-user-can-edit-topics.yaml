appId: ${APP_ID}
env:
  APP_ID: uk.gov.govuk.dev

tags:
  - end-to-end

---

- launchApp:
    clearState: true

- runFlow: auth/sign-in.yaml

- runFlow: onboarding/accept-terms.yaml

- runFlow: onboarding/accept-statistics-sharing.yaml

- runFlow: topics/select-initial-topics.yaml

- runFlow: onboarding/skip-notifications.yaml

- stopApp

- launchApp

- runFlow: device-specific/edit-initial-topics.yaml

- runFlow: topics/validate-edited-topics.yaml
