appId: uk.gov.govuk.dev
---

- scrollUntilVisible:
    element:
      text: "Benefits.*"
    direction: UP
    centerElement: true
- assertVisible: "Benefits.*"
- tapOn: "Benefits.*"

- scrollUntilVisible:
    element:
      text: "Driving and transport.*"
    centerElement: true
- assertVisible: "Driving and transport.*"
- tapOn: "Driving and transport.*"

- scrollUntilVisible:
    element:
      text: "Money and tax.*"
    centerElement: true
- assertVisible: "Money and tax.*"
- tapOn: "Money and tax.*"

- scrollUntilVisible:
    element:
      text: "Travel abroad.*"
    centerElement: true
- assertVisible: "Travel abroad.*"
- tapOn: "Travel abroad.*"

# The Done tap can land while the list is still settling after the scroll above
# and be ignored, leaving the topics screen open. Tap again while it's showing.
- tapOn:
    text: "Done"
    waitToSettleTimeoutMs: 5000
    retryTapIfNoChange: true
- repeat:
    while:
      visible: "Done"
      notVisible: "Allow notifications\\?|Your topics"
    times: 3
    commands:
    - tapOn: "Done"
    - waitForAnimationToEnd:
        timeout: 3000